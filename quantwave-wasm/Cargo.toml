[package]
name = "quantwave-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "wasm-bindgen bindings exposing quantwave-core streaming indicators to JS/WASM (quantwave-stb8)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quantwave-core = { workspace = true }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
