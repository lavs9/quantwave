[package]
name = "quantwave-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "wasm-bindgen bindings exposing quantwave-core streaming indicators to JS/WASM (quantwave-stb8)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quantwave-core = { workspace = true }
wasm-bindgen = "0.2"

# quantwave-core pulls in `rand` v0.8 transitively via `nalgebra` (non-optional),
# which pulls in `getrandom` v0.2. getrandom 0.2 refuses to compile for
# wasm32-unknown-unknown unless its "js" feature is enabled (it needs to bind
# to the browser/Node `crypto` API for entropy). Enabling the feature here,
# scoped to wasm32 only, does NOT change quantwave-core's own Cargo.toml or its
# native dependency graph — it only unifies the feature set of the shared
# getrandom crate when *this* crate is the one being built for wasm32.
# See: https://docs.rs/getrandom/latest/getrandom/#webassembly-support
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
