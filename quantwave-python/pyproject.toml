[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "quantwave"
dynamic = ["version"]
description = "221-indicator Polars-native quant library: Rust core, .ta/.bt namespaces, streaming parity, Ehlers DSP, backtest engine"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mayank Lavania" }]
keywords = ["technical-analysis", "ta-lib", "trading", "quant", "rust", "polars", "backtest", "ehlers", "indicators"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"

[project.scripts]
quantwave = "quantwave.cli:main"

[project.optional-dependencies]
polars = ["polars>=1.20.0,<2.0.0"]
all = ["polars>=1.20.0,<2.0.0"]

[project.urls]
Homepage = "https://github.com/lavs9/quantwave"
Documentation = "https://lavs9.github.io/quantwave/"
Comparison = "https://lavs9.github.io/quantwave/comparison/"
"AI index (llms.txt)" = "https://lavs9.github.io/quantwave/llms.txt"
FAQ = "https://lavs9.github.io/quantwave/faq/"
Changelog = "https://lavs9.github.io/quantwave/changelog/"
Repository = "https://github.com/lavs9/quantwave"
"Bug Tracker" = "https://github.com/lavs9/quantwave/issues"

[tool.maturin]
module-name = "quantwave._quantwave"
python-source = "python"
