name: docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "cache_id=$(date --utc +%V)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements-docs.txt
      # Install the released quantwave package from PyPI.
      # This lets us actually execute the marimo notebooks (including `import quantwave`)
      # during the export step so we can capture real outputs.
      - run: pip install quantwave
      - run: cargo run --package quantwave-xtask
      # Pre-export marimo notebooks to HTML. This is much more reliable on static GitHub Pages
      # than trying to run the raw .py files at view time via the mkdocs-marimo plugin.
      - run: python docs/export_notebooks.py
      - run: mkdocs gh-deploy --force
