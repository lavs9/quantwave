name: docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "cache_id=$(date --utc +%V)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements-docs.txt
      # Build the Python package so that `import quantwave` works during notebook export
      - run: maturin develop -p quantwave-python --release
      - run: cargo run --package quantwave-xtask
      # Export marimo notebooks to self-contained HTML (much more reliable on static GitHub Pages
      # than trying to execute .py files at runtime via the mkdocs-marimo plugin)
      - run: python docs/export_notebooks.py
      - run: mkdocs gh-deploy --force
