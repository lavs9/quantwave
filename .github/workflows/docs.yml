name: docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "cache_id=$(date --utc +%V)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements-docs.txt

      # Build and install the local Python package from source.
      # This ensures mkdocstrings/griffe sees the current Python surface
      # (including new PA bindings and _metadata) instead of the old PyPI version.
      - name: Build local quantwave Python package
        run: |
          pip install maturin
          maturin develop -m quantwave-python/Cargo.toml --release

      - run: cargo run --package quantwave-xtask
      # Pre-export marimo notebooks to HTML. This is much more reliable on static GitHub Pages
      # than trying to run the raw .py files at view time via the mkdocs-marimo plugin.
      - run: python docs/export_notebooks.py
      - run: mkdocs gh-deploy --force
