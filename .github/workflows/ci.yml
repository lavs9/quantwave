# CI — every push/PR to main
#
# Full quality gate (nextest, wheel smoke, pytest) runs locally via pre-push hook:
#   ./scripts/install-git-hooks.sh
#
# Pipeline:
#   1. sanity   — fast metadata + doc drift checks (~1 min)
#   2. plugins  — plugin wheel smoke test (only when quantwave-plugins/ changes)
#   3. docs     — mkdocs gh-pages deploy (main branch only)
#
# Release (crates.io + PyPI) is a separate workflow: release.yml on v* tags.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Doc & metadata sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Metadata and documentation drift
        run: |
          python3 scripts/check_metadata_drift.py
          python3 scripts/check_doc_drift.py
          python3 scripts/check_public_metadata.py

  plugins:
    name: Plugin wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            plugins:
              - 'quantwave-plugins/**'

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.plugins == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.plugins == 'true' || github.event_name == 'workflow_dispatch'

      - name: Build plugin wheel
        if: steps.changes.outputs.plugins == 'true' || github.event_name == 'workflow_dispatch'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path quantwave-plugins/Cargo.toml --out dist

      - name: Test plugin wheel
        if: steps.changes.outputs.plugins == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install polars pytest
          pip install dist/*.whl
          pytest quantwave-plugins/tests -q

      - name: Skipped (no plugin changes)
        if: steps.changes.outputs.plugins != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "quantwave-plugins/ unchanged — plugin wheel job skipped."

  deploy-docs:
    name: Deploy docs
    needs: [sanity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: .cache
          key: mkdocs-material-${{ runner.os }}-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: mkdocs-material-${{ runner.os }}-

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Install quantwave from PyPI (notebook export)
        run: pip install quantwave || echo "PyPI wheel not yet available; notebook export may use fallbacks."

      - run: cargo run --package quantwave-xtask
      - run: python docs/export_notebooks.py
      - run: mkdocs gh-deploy --force