name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  metadata-drift:
    name: Metadata codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metadata-${{ hashFiles('**/Cargo.lock') }}
      - run: python3 scripts/check_metadata_drift.py

  verify:
    name: quantwave verify
    runs-on: ubuntu-latest
    needs: [metadata-drift]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('**/Cargo.lock') }}
      - run: pip install pytest polars
      - run: chmod +x scripts/quantwave_verify.sh
      - run: ./scripts/quantwave_verify.sh --skip-metadata