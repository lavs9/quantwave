name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  metadata-drift:
    name: Metadata codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metadata-${{ hashFiles('**/Cargo.lock') }}
      - name: Check metadata drift
        run: python3 scripts/check_metadata_drift.py
      - name: Check doc drift
        run: python3 scripts/check_doc_drift.py
      - name: Lint doc structure
        run: python3 docs/upgrade_to_standards.py --lint
      - name: Lint doc depth
        run: python3 docs/upgrade_to_standards.py --depth-lint

  verify:
    name: quantwave verify
    runs-on: ubuntu-latest
    needs: [metadata-drift]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Python deps and native extensions
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest polars maturin "uniffi-bindgen==0.31.0"
          maturin develop --manifest-path quantwave-python/Cargo.toml --release
          maturin develop --manifest-path quantwave-backtest-py/Cargo.toml --release
      - run: chmod +x scripts/quantwave_verify.sh
      - name: quantwave verify
        run: |
          source .venv/bin/activate
          ./scripts/quantwave_verify.sh --skip-metadata