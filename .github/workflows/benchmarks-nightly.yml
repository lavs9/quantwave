# Nightly benchmark harness — measures, renders docs, commits JSON + benchmarks.md
#
# Manual: workflow_dispatch
# Schedule: Sunday 06:00 UTC (pinned ubuntu-latest; full 1M-row suite)

name: Benchmarks Nightly

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: benchmarks-nightly
  cancel-in-progress: false

jobs:
  run-harness:
    name: Run harness and update results
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out over SSH with the "benchmarks-nightly (write)" deploy key so
      # the results push at the end of this job authenticates as that key rather
      # than as github-actions[bot]. The key is a bypass actor on the "main
      # protect" ruleset; the bot is not, and cannot be -- GitHub only allows the
      # Actions integration as a bypass actor on ORG-owned repos, and this repo
      # is user-owned (see the push step below).
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.BENCHMARK_DEPLOY_KEY }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python benchmark deps
        # pyarrow is required: the memory benchmark calls polars .to_pandas(),
        # which delegates to pyarrow (an optional polars dependency).
        run: pip install polars pandas pyarrow numpy psutil maturin wheel

      - name: Build and install quantwave wheel
        run: |
          maturin build --release --manifest-path quantwave-py/Cargo.toml --out dist
          pip install dist/quantwave-*.whl "polars>=1.20.0,<2.0.0"

      - name: Run benchmark harness (1M rows)
        run: python benchmarks/harness.py

      - name: Render benchmarks.md from JSON
        run: python scripts/render_benchmarks.py

      - name: Validate benchmark claims drift
        run: python scripts/check_benchmark_claims.py

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/latest.json docs/benchmarks.md
          if git diff --staged --quiet; then
            echo "No benchmark changes to commit"
          else
            git commit -m "chore(benchmarks): nightly harness results [skip ci]"
            # This pushes straight to a protected branch. It works only because
            # the checkout above used the "benchmarks-nightly (write)" deploy
            # key, which is registered as an "always" bypass actor on the "main
            # protect" ruleset. Without it the push is rejected outright:
            #   GH013: - Changes must be made through a pull request.
            #          - Required status check "Doc & metadata sanity" is expected.
            # (and [skip ci] below guarantees that check can never report, so the
            # PR route would deadlock rather than merge).
            #
            # If these pushes start failing with GH013 again, the cause is the
            # ruleset or the deploy key -- check those before touching anything
            # in this file. Note github-actions[bot] CANNOT be granted the same
            # bypass: GitHub only accepts the Actions integration as a bypass
            # actor on org-owned repos, and this repo is user-owned.
            #
            # The retry below is for a DIFFERENT failure: the harness takes
            # several minutes, so main can genuinely move underneath us and a
            # bare push loses the whole run's results to "! [rejected] (fetch
            # first)". The two files we touch are generated, so a rebase can
            # never conflict meaningfully.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push failed (attempt $attempt) -- rebasing onto origin/main"
              git pull --rebase --autostash origin main
            done
            echo "::error::could not push benchmark results after 3 attempts"
            exit 1
          fi

  criterion-smoke:
    name: Criterion bench smoke (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo bench smoke
        run: cargo bench -p quantwave-core --bench indicator_throughput -- --sample-size 10