# Release — push a version tag (v*)
#
# Pipeline:
#   1. publish-rust      — crates.io (core → polars → plugins → backtest → quantwave)
#   2. build-python-*    — wheels (linux x64/arm, macOS, windows) + sdist
#   3. publish-python    — PyPI via twine
#
# Day-to-day CI is .github/workflows/ci.yml (no publish).

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-rust:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish quantwave-core
        run: cargo publish -p quantwave-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for quantwave-core on crates.io
        run: sleep 45

      - name: Publish quantwave-polars
        run: cargo publish -p quantwave-polars
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish quantwave-plugins
        run: cargo publish -p quantwave-plugins
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish quantwave-backtest
        run: cargo publish -p quantwave-backtest
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for dependencies on crates.io
        run: sleep 45

      - name: Publish quantwave
        run: cargo publish -p quantwave
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  build-python-wheels:
    name: Python wheels (${{ matrix.platform }})
    needs: [publish-rust]
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, ubuntu-22.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and uniffi-bindgen
        run: pip install maturin uniffi-bindgen==0.31.0

      - name: Build wheels
        run: |
          cd quantwave-python
          maturin build --release --out ../dist
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl

  build-python-sdist:
    name: Python sdist
    needs: [publish-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install maturin uniffi-bindgen==0.31.0

      - name: Build sdist
        run: |
          cd quantwave-python
          maturin sdist --out ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish-python:
    name: Publish Python (PyPI)
    needs: [build-python-wheels, build-python-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-22.04-arm
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-latest
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows-latest
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: wheels-sdist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install twine

      - name: Publish to PyPI
        run: |
          ls -la dist/
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}