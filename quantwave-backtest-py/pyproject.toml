[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "quantwave-backtest-native"
dynamic = ["version"]
description = "Native PyO3 backtest extension for quantwave (bundled in quantwave wheel)"
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "quantwave._backtest"
python-source = "../quantwave-python/python"