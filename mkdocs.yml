site_name: QuantWave
site_url: https://lavs9.github.io/quantwave/
site_description: High-performance Rust + Polars quantitative finance library with 221 native indicators, full Ehlers DSP suite, backtest engine, and options pricing tools.
repo_name: lavs9/quantwave
repo_url: https://github.com/lavs9/quantwave
edit_uri: edit/main/docs/

# Targeted link/anchor validation (5ipk.5). Real breakage → warn (fails under
# --strict); benign nav/orphan noise stays info so builds aren't brittle.
validation:
  omitted_files: info
  absolute_links: warn
  # Bare directory links (e.g. ../native/) resolve via directory URLs in the
  # browser but MkDocs can't map them to a source file — don't fail on them.
  unrecognized_links: ignore
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: ignore
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    logo: material/chart-timeline-variant
    favicon: material/chart-bell-curve-cumulative

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lavs9/quantwave
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/quantwave/

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Python: getting-started/python.md
      - Rust: getting-started/rust.md
  - Rust:
      - Overview: guides/rust/index.md
      - Crate Map: guides/rust/crate-map.md
      - Next<T> Pattern: guides/rust/next-trait.md
      - Backtest Engine: guides/rust/backtest.md
  - Indicators:
      - Overview: guides/indicators/index.md
      - Gallery: guides/indicators/gallery.md
      - Full Catalog: guides/indicators/native/index.md
      - Bar Types & Patterns: guides/indicators/bars_and_patterns.md
      - Live Playground (WASM): guides/wasm-playground.md
      - Ehlers DSP: guides/indicators/ehlers/index.md
      - Regime Detection: guides/indicators/regimes/index.md
      - ML Features: guides/ml_features.md
      - Plugin vs .ta: guides/plugin_vs_ta.md
      - Options India: guides/options_india.md
      - TA-Lib Migration: guides/talib_migration.md
  - Backtest:
      - Overview: guides/backtest/index.md
      - Quickstart: guides/backtest/quickstart.md
      - Output Contract: guides/backtest/output-contract.md
      - Capability Matrix: guides/backtest/capability_matrix.md
      - Tear Sheets: guides/backtest/tear_sheets.md
  - Examples:
      - Batch & Streaming: examples/batch-streaming.md
      - Notebooks: examples/notebooks/index.md
  - Reference:
      - FAQ: faq.md
      - Validation: validation.md
      - Python API: api/
      - Benchmarks: benchmarks.md
      - Comparison: comparison.md
      - Roadmap: roadmap.md
      - Releases:
          - 0.7.0: releases/0.7.0.md
          - 0.6.0: releases/0.6.0.md
          - 0.5.2: releases/0.5.2.md
      - Changelog: changelog.md
      - Contributing: contributing.md

extra_css:
  - assets/indicator-badges.css
  - assets/landing.css
  - assets/wasm/playground.css

plugins:
  - search
  - marimo
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      exclude:
        - api/*
        - examples/notebooks/*.py
        - examples/notebooks/*.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["quantwave-py/python"]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
  - gen-files:
      scripts:
        - docs/gen_python_api.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        # Route ```mermaid fences to mkdocs-material's mermaid.js renderer.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tasklist
  - admonition
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: assets/wasm/playground.js
    type: module